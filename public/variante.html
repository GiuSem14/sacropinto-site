<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Il sacro, sulla pelle.</title>
<style>
/* =====================================================================
   CONFIGURATORE LIVE — engine.css
   Layout: il sito vive in #stage > #site (container query "site").
   Il pannello #cfg è un attrezzo da lavoro: grafite neutra, non tocca il brand.
   ===================================================================== */
:root {
  --cfg-bg: #16181d;
  --cfg-bg-2: #1e2128;
  --cfg-bg-3: #272b34;
  --cfg-line: #333846;
  --cfg-ink: #eceef3;
  --cfg-muted: #9aa1b2;
  --cfg-hi: #8fa8ff;
  --cfg-hi-ink: #0d1020;
  --cfg-warn: #f2b45a;
  --cfg-font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --cfg-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --cfg-w: 360px;
  color-scheme: light;
}
html { scroll-behavior: auto; }
body { background: #0f1013; margin: 0; }
html.lenis, html.lenis body { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto !important; }
.lenis.lenis-stopped { overflow: hidden; }

/* ---------- stage & site ---------- */
#stage {
  position: relative;
  min-height: 100vh;
  background: var(--c-bg, #fff);
  color: var(--c-ink, #111);
  font-family: var(--f-body, system-ui, sans-serif);
  transition: margin-right .35s cubic-bezier(.2,.7,.2,1);
}
#site {
  container-type: inline-size;
  container-name: site;
  position: relative;
  margin-inline: auto;
  width: 100%;
  background: var(--c-bg, #fff);
  color: var(--c-ink, #111);
  overflow-x: clip;
}
#site *, #site *::before, #site *::after { box-sizing: border-box; }
#site img { max-width: 100%; display: block; }
#site a { color: inherit; }
body.cfg-mobile #stage { background: #0f1013; padding-block: 0; }
body.cfg-mobile #site {
  max-width: 390px;
  box-shadow: 0 0 0 1px #2b2f39, 0 30px 80px rgba(0,0,0,.55);
  min-height: 100vh;
}
body.cfg-side #stage { margin-right: var(--cfg-w); }

/* layer per elementi fluttuanti del sito (es. bottone WhatsApp) */
#site-float { position: fixed; inset: 0; pointer-events: none; z-index: 60; display: flex; justify-content: center; }
body.cfg-side #site-float { right: var(--cfg-w); }
#site-float > .frame { position: relative; width: 100%; height: 100%; container-type: inline-size; container-name: site; }
body.cfg-mobile #site-float > .frame { max-width: 390px; }
/* il layer float non cattura mai i clic: solo i suoi controlli veri sono cliccabili */
#site-float > .frame * { pointer-events: none; }
#site-float > .frame :is(a, button, input, select, textarea, label, summary, [role="button"], [data-interactive], [contenteditable="true"]),
#site-float > .frame :is(a, button, [role="button"], [data-interactive]) * { pointer-events: auto; }

/* wrapper di sezione */
.cfg-sec { position: relative; }
.cfg-sec.cfg-sticky { position: sticky; top: 0; z-index: 50; }
.cfg-sec.cfg-overlay { height: 0; }
.cfg-sec.cfg-flash > :not(.cfg-tools) { animation: cfgFlash .7s ease; }
@keyframes cfgFlash { from { filter: brightness(1.25) saturate(1.1); } to { filter: none; } }

/* pill sulla sezione */
.cfg-tools {
  position: absolute; z-index: 70; top: 14px; right: 14px;
  display: flex; align-items: center; gap: 2px;
  padding: 4px; border-radius: 999px;
  background: rgba(22,24,29,.88); color: var(--cfg-ink);
  font: 500 12px/1 var(--cfg-font);
  box-shadow: 0 6px 24px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08);
  backdrop-filter: blur(8px);
  opacity: 0; transform: translateY(-4px); pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.cfg-sec.cfg-sticky > .cfg-tools { top: 86px; }
.cfg-sec:hover > .cfg-tools, .cfg-sec.cfg-focus > .cfg-tools { opacity: 1; transform: none; pointer-events: auto; }
body.cfg-present .cfg-tools, body.cfg-edit .cfg-tools { display: none; }
.cfg-tools button {
  all: unset; cursor: pointer; display: grid; place-items: center;
  width: 28px; height: 28px; border-radius: 999px; color: var(--cfg-ink);
}
.cfg-tools button:hover { background: rgba(255,255,255,.12); }
.cfg-tools button:focus-visible { outline: 2px solid var(--cfg-hi); }
.cfg-tools .lab { padding: 0 8px; white-space: nowrap; }
.cfg-tools .lab b { color: var(--cfg-hi); font-weight: 600; margin-right: 6px; }

/* modifica testi */
body.cfg-edit [data-edit] { outline: 1.5px dashed color-mix(in srgb, var(--cfg-hi) 70%, transparent); outline-offset: 3px; cursor: text; border-radius: 2px; }
body.cfg-edit [data-edit]:focus { outline: 2px solid var(--cfg-hi); background: color-mix(in srgb, var(--cfg-hi) 12%, transparent); }

/* placeholder foto */
.ph {
  position: relative; overflow: hidden; isolation: isolate;
  width: 100%; max-width: 100%;
  background: var(--c-surface, #ddd);
  border-radius: inherit;
}
.ph > .ph-art { position: absolute; inset: 0; }
.ph > .ph-art > svg { width: 100%; height: 100%; display: block; }
.ph.ph-auto > .ph-art {
  background:
    radial-gradient(120% 90% at var(--ph-x,30%) var(--ph-y,20%), color-mix(in srgb, var(--c-accent, #c66) 75%, transparent), transparent 60%),
    radial-gradient(90% 80% at calc(100% - var(--ph-x,30%)) 100%, color-mix(in srgb, var(--c-accent2, var(--c-accent, #c66)) 55%, transparent), transparent 65%),
    linear-gradient(var(--ph-a, 160deg), color-mix(in srgb, var(--c-ink, #222) 82%, var(--c-bg, #fff)), color-mix(in srgb, var(--c-ink, #222) 40%, var(--c-bg, #fff)));
}
.ph::after {
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: .22; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.ph > .ph-tag {
  position: absolute; z-index: 2; left: 10px; bottom: 10px; max-width: calc(100% - 20px);
  padding: 5px 8px; border-radius: 4px;
  font: 600 10px/1.25 var(--cfg-mono); letter-spacing: .06em; text-transform: uppercase;
  color: #fff; background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
}
body.cfg-present .ph > .ph-tag { opacity: .7; }

/* badge "demo" */
#cfg-demo-badge {
  position: fixed; z-index: 80; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  font: 600 10.5px/1 var(--cfg-mono); letter-spacing: .08em; text-transform: uppercase;
  color: #f4f4f4; background: rgba(15,16,19,.78); padding: 8px 10px; border-radius: 6px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); pointer-events: none;
}
body.cfg-present #cfg-demo-badge { opacity: .55; }

/* ---------- pannello ---------- */
#cfg, #cfg * { box-sizing: border-box; }
#cfg { font: 400 13px/1.45 var(--cfg-font); color: var(--cfg-ink); }
#cfg button, #cfg select, #cfg input { font: inherit; color: inherit; }
#cfg :focus-visible { outline: 2px solid var(--cfg-hi); outline-offset: 2px; }

#cfg-dock {
  position: fixed; z-index: 90;
  left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px; padding: 5px;
  background: rgba(22,24,29,.92); border-radius: 999px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08);
  backdrop-filter: blur(10px);
  transition: opacity .25s, transform .25s;
}
body.cfg-open #cfg-dock { opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }
body.cfg-present #cfg-dock { opacity: 0; pointer-events: none; }
#cfg-dock button {
  all: unset; cursor: pointer; height: 32px; min-width: 32px; padding: 0 10px; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: 600 12.5px/1 var(--cfg-font); color: var(--cfg-ink);
}
#cfg-dock button:hover { background: rgba(255,255,255,.1); }
#cfg-dock button[aria-pressed="true"] { background: var(--cfg-hi); color: var(--cfg-hi-ink); }
#cfg-dock .sep { width: 1px; height: 18px; background: var(--cfg-line); margin: 0 2px; }

#cfg-panel {
  position: fixed; z-index: 95; top: 0; right: 0; bottom: 0; width: min(var(--cfg-w), 100vw);
  background: var(--cfg-bg); border-left: 1px solid var(--cfg-line);
  display: grid; grid-template-rows: auto auto 1fr auto;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.7,.2,1);
  box-shadow: -20px 0 60px rgba(0,0,0,.35);
}
body.cfg-open #cfg-panel { transform: none; }
body.cfg-present #cfg-panel { transform: translateX(105%); }

.cfg-head { padding: 16px 16px 12px; display: grid; gap: 4px; border-bottom: 1px solid var(--cfg-line); }
.cfg-head .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cfg-eyebrow { font: 600 10.5px/1 var(--cfg-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--cfg-muted); }
.cfg-client { font-size: 17px; font-weight: 650; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.cfg-icon { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--cfg-muted); }
.cfg-icon:hover { background: var(--cfg-bg-3); color: var(--cfg-ink); }

.cfg-tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--cfg-line); }
.cfg-tabs button {
  all: unset; cursor: pointer; padding: 8px 10px 10px; font-weight: 550; color: var(--cfg-muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.cfg-tabs button[aria-selected="true"] { color: var(--cfg-ink); border-color: var(--cfg-hi); }

.cfg-body { overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 24px; display: grid; gap: 18px; align-content: start; }
.cfg-body[hidden] { display: none !important; }
.cfg-group { display: grid; gap: 8px; }
.cfg-label { font: 600 10.5px/1 var(--cfg-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--cfg-muted); display: flex; justify-content: space-between; gap: 8px; }
.cfg-label kbd { font: inherit; color: var(--cfg-muted); opacity: .8; }

.cfg-props { display: grid; gap: 6px; }
.cfg-prop {
  all: unset; cursor: pointer; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start;
  padding: 10px; border-radius: 10px; background: var(--cfg-bg-2); box-shadow: inset 0 0 0 1px var(--cfg-line);
}
.cfg-prop:hover { background: var(--cfg-bg-3); }
.cfg-prop[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--cfg-hi); background: color-mix(in srgb, var(--cfg-hi) 9%, var(--cfg-bg-2)); }
.cfg-prop .k { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font: 700 13px/1 var(--cfg-mono); background: var(--cfg-bg-3); }
.cfg-prop[aria-pressed="true"] .k { background: var(--cfg-hi); color: var(--cfg-hi-ink); }
.cfg-prop .t { font-weight: 600; }
.cfg-prop .d { color: var(--cfg-muted); font-size: 12px; margin-top: 2px; }
.cfg-prop .sw { display: flex; gap: 3px; margin-top: 7px; }
.cfg-prop .sw i { width: 14px; height: 14px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }

.cfg-secs { display: grid; gap: 4px; }
.cfg-secrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--cfg-bg-2); }
.cfg-secrow.on { box-shadow: inset 0 0 0 1px var(--cfg-hi); }
.cfg-secrow .n { all: unset; cursor: pointer; font-weight: 600; min-width: 0; }
.cfg-secrow .n small { display: block; font-weight: 400; color: var(--cfg-muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cfg-chips { display: flex; gap: 3px; }
.cfg-chips button {
  all: unset; cursor: pointer; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center;
  font: 600 11.5px/1 var(--cfg-mono); background: var(--cfg-bg-3); color: var(--cfg-muted);
}
.cfg-chips button:hover { color: var(--cfg-ink); }
.cfg-chips button[aria-pressed="true"] { background: var(--cfg-hi); color: var(--cfg-hi-ink); }

.cfg-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; background: var(--cfg-bg-2); border-radius: 9px; box-shadow: inset 0 0 0 1px var(--cfg-line); }
.cfg-seg button { all: unset; cursor: pointer; text-align: center; padding: 7px 6px; border-radius: 7px; font-weight: 550; color: var(--cfg-muted); }
.cfg-seg button[aria-pressed="true"] { background: var(--cfg-bg-3); color: var(--cfg-ink); box-shadow: inset 0 0 0 1px #4a5060; }

.cfg-pals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cfg-pal { all: unset; cursor: pointer; padding: 6px; border-radius: 8px; background: var(--cfg-bg-2); box-shadow: inset 0 0 0 1px var(--cfg-line); display: grid; gap: 5px; }
.cfg-pal[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--cfg-hi); }
.cfg-pal .bar { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; height: 22px; border-radius: 4px; overflow: hidden; }
.cfg-pal span { font-size: 11px; color: var(--cfg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.cfg-field { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--cfg-bg-2); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--cfg-line); }
.cfg-field input[type=color] { width: 34px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; }
.cfg-field select { flex: 1; min-width: 0; background: var(--cfg-bg-3); border: 1px solid var(--cfg-line); border-radius: 6px; padding: 6px 8px; }
.cfg-field .grow { flex: 1; min-width: 0; color: var(--cfg-muted); font-size: 12px; }
.cfg-link { all: unset; cursor: pointer; color: var(--cfg-hi); font-size: 12px; font-weight: 550; }

.cfg-check { display: grid; gap: 2px; }
.cfg-check label { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; padding: 6px 4px; border-radius: 6px; cursor: pointer; }
.cfg-check label:hover { background: var(--cfg-bg-2); }
.cfg-check input { margin: 2px 0 0; accent-color: var(--cfg-hi); }
.cfg-check input:checked + span { color: var(--cfg-muted); text-decoration: line-through; }
.cfg-feat { display: grid; gap: 6px; }
.cfg-feat div { padding: 9px 10px; border-radius: 8px; background: var(--cfg-bg-2); display: grid; gap: 2px; }
.cfg-feat b { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.cfg-feat em { font-style: normal; font: 600 10px/1 var(--cfg-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--cfg-warn); white-space: nowrap; padding-top: 3px; }
.cfg-feat span { color: var(--cfg-muted); font-size: 12px; }
.cfg-talk { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--cfg-ink); }

.cfg-foot { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 12px 16px; border-top: 1px solid var(--cfg-line); background: var(--cfg-bg); }
.cfg-btn {
  all: unset; cursor: pointer; text-align: center; padding: 9px 8px; border-radius: 9px; font-weight: 600; font-size: 12.5px;
  background: var(--cfg-bg-3); box-shadow: inset 0 0 0 1px var(--cfg-line);
}
.cfg-btn:hover { background: #313642; }
.cfg-btn.primary { background: var(--cfg-hi); color: var(--cfg-hi-ink); box-shadow: none; }
.cfg-btn[aria-pressed="true"] { background: var(--cfg-warn); color: #1d1406; box-shadow: none; }

/* modale brief */
#cfg-modal { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; padding: 16px; background: rgba(8,9,12,.7); backdrop-filter: blur(4px); }
#cfg-modal .box { width: min(720px, 100%); max-height: min(86vh, 900px); display: grid; grid-template-rows: auto 1fr auto; gap: 12px; background: var(--cfg-bg); border-radius: 14px; padding: 18px; box-shadow: inset 0 0 0 1px var(--cfg-line), 0 30px 80px rgba(0,0,0,.5); }
#cfg-modal h3 { margin: 0; font-size: 16px; }
#cfg-modal p { margin: 4px 0 0; color: var(--cfg-muted); font-size: 12.5px; }
#cfg-modal textarea { width: 100%; min-height: 320px; resize: vertical; background: var(--cfg-bg-2); color: var(--cfg-ink); border: 1px solid var(--cfg-line); border-radius: 10px; padding: 12px; font: 12px/1.5 var(--cfg-mono); }
#cfg-modal .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
#cfg-modal .msg { margin-right: auto; color: var(--cfg-muted); font-size: 12px; }

#cfg-toast {
  position: fixed; z-index: 130; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  padding: 9px 14px; border-radius: 999px; background: #0d0e11; color: #fff; font: 550 12.5px/1 var(--cfg-font);
  box-shadow: 0 10px 30px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.1);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#cfg-toast.on { opacity: 1; transform: translate(-50%, 0); }

/* split text helpers */
.cfg-w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; margin-bottom: -.08em; }
.cfg-w > i { display: inline-block; font-style: inherit; will-change: transform; }
.cfg-c { display: inline-block; will-change: transform; }

@media (max-width: 560px) {
  #cfg-panel { width: 100vw; }
  body.cfg-side #stage { margin-right: 0; }
  #cfg-dock .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #cfg-panel, #stage, #cfg-dock, .cfg-tools { transition: none; }
}

/* ===== sito: sacropinto ===== */
/* =====================================================================
   SACROPINTO — site.css   (prefisso .sp-, solo token --c-* / --f-*)
   ===================================================================== */
#site { --pad: clamp(16px, 5cqi, 72px); --py: clamp(56px, 9cqi, 120px); --r: 6px; --wa: #25d366; --wa-ink: #073b1c; font-family: var(--f-body); line-height: 1.55; font-size: clamp(15px, 1.05cqi, 17px); --lit: 0; }
:where(#site) section, :where(#site) footer, :where(#site) .sp-hd { position: relative; }
:where(#site) section { padding: var(--py) var(--pad); }
:where(#site) h1, :where(#site) h2, :where(#site) h3, :where(#site) h4 { font-family: var(--f-display); font-weight: 600; line-height: 1.02; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
:where(#site) p { margin: 0; }
:where(#site) a { text-decoration: none; }
:where(#site) :focus-visible { outline: 2px solid var(--c-accent); outline-offset: 3px; border-radius: 3px; }
:where(#site) ul, :where(#site) ol { margin: 0; padding: 0; list-style: none; }
:where(#site) svg { display: block; }
:where(#site) .ph { border-radius: var(--r); }
:where(#site) button { font-family: inherit; }
:where(#site) h3 { font-size: clamp(20px, 1.9cqi, 28px); }
:where(#site) h4 { font-size: 17px; }
.hide { display: none !important; }

/* ---- carattere per proposta ---- */
#stage[data-proposal="A"] #site { --r: 6px; }
#stage[data-proposal="B"] #site { --r: 0px; }
#stage[data-proposal="C"] #site { --r: 2px; }
#stage[data-proposal="A"] #site :is(h1, h2) { font-weight: 600; letter-spacing: -0.015em; }
#stage[data-proposal="A"] #site .sp-h1 em, #stage[data-proposal="A"] #site .sp-h2 em { font-style: italic; }
#stage[data-proposal="B"] #site :is(h1, h2, h3, .sp-price, .sp-step-n) { font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em; line-height: 0.94; }
#stage[data-proposal="B"] #site .sp-h1 { letter-spacing: 0; }
#stage[data-proposal="B"] #site .sp-kicker { font-weight: 700; }
#stage[data-proposal="B"] #site .sp-btn { text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
#stage[data-proposal="C"] #site :is(h1, h2, h3) { font-weight: 400; letter-spacing: -0.02em; line-height: 1.02; }
#stage[data-proposal="C"] #site .sp-btn { border-radius: 999px; font-weight: 500; }
#stage[data-proposal="C"] #site .sp-kicker { color: var(--c-muted); letter-spacing: .2em; }
#stage[data-proposal="C"] #site .sp-kicker i { background: var(--c-accent2); box-shadow: none; }
#stage[data-proposal="C"] #site .sp-burst { opacity: .35; }

/* ---- tipografia ---- */
.sp-h1 { font-size: clamp(42px, 7.6cqi, 116px); max-width: 12ch; }
.sp-h1.giant { font-size: clamp(64px, 17cqi, 260px); max-width: none; line-height: .88; letter-spacing: -.03em; margin: 10px 0 20px; }
.sp-h2 { font-size: clamp(32px, 4.8cqi, 68px); max-width: 18ch; position: relative; }
.sp-h2.xl { font-size: clamp(36px, 6cqi, 88px); max-width: 16ch; margin-inline: auto; text-align: center; }
.sp-h2-wrap { position: relative; display: block; width: fit-content; max-width: 100%; }

.sp-step-n { font-family: var(--f-display); font-size: clamp(26px, 2.8cqi, 40px); color: var(--c-accent); line-height: 1; font-weight: 600; }

/* ---- bottoni ---- */

/* ---- marquee / nastri ---- */

/* ---- form ---- */

/* ---- testo che si riempie, citazioni ---- */

.sp-works { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

.sp-pf-cta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 30px; margin-top: clamp(28px, 4cqi, 48px); padding-top: 24px; border-top: 1px solid var(--c-line); }

/* ===== HEADER ===== */

#stage[data-proposal="C"] #site .sp-brand { font-weight: 400; letter-spacing: 0; }
.sp-nav { display: flex; gap: clamp(12px, 1.6cqi, 24px); margin-left: auto; }

.sp-open { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--c-muted); white-space: nowrap; }

@keyframes spBlink { 50% { opacity: .35; } }
.sp-burger { display: none; width: 44px; height: 44px; border-radius: var(--r); border: 1px solid var(--c-line); background: var(--c-bg); cursor: pointer; margin-left: auto; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
.sp-burger i { width: 18px; height: 2px; background: var(--c-ink); transition: transform .3s; }
.sp-hd.open .sp-burger i:first-child { transform: translateY(3.5px) rotate(45deg); }
.sp-hd.open .sp-burger i:last-child { transform: translateY(-3.5px) rotate(-45deg); }
.sp-hd2 { padding-top: 14px; }
.sp-hd2-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; padding: 10px 18px; border-bottom: 1px solid var(--c-line); background: color-mix(in srgb, var(--c-bg) 70%, transparent); backdrop-filter: blur(12px); margin-right: clamp(0px, 14cqi, 220px); }
.sp-hd2-row .sp-nav.left { margin: 0; justify-content: flex-start; }
.sp-brand.center { justify-self: center; }

.sp-hd3 { padding: 0; }

.sp-ticker { overflow: hidden; background: var(--c-accent); color: var(--c-bg); }

/* ===== APERTURA ===== */
.sp-hero { min-height: min(100vh, 940px); display: grid; align-content: center; overflow: hidden; }
.sp-hero1 { padding-top: clamp(110px, 14cqi, 160px); background: radial-gradient(60% 60% at 78% 45%, color-mix(in srgb, var(--c-accent) calc(var(--lit) * 22%), transparent), transparent 70%); }
.sp-hero1-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(24px, 5cqi, 80px); align-items: center; }
.sp-hero-txt .sp-h1 { margin: 6px 0 22px; }
.sp-hero-art { position: relative; }
.sp-halo-wrap { position: relative; width: min(560px, 100%); margin-inline: auto; aspect-ratio: 1; display: grid; place-items: center; }
.sp-halo-hero { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 0 calc(var(--lit) * 24px) color-mix(in srgb, var(--c-accent) 70%, transparent)); opacity: calc(.55 + var(--lit) * .45); }

.sp-scroll { position: absolute; left: var(--pad); bottom: 24px; z-index: 1; display: inline-flex; align-items: center; gap: 10px; font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--c-muted); }
.sp-scroll svg { animation: spBob 1.8s ease-in-out infinite; }
@keyframes spBob { 50% { transform: translateY(6px); } }
.sp-hero2 { padding-top: clamp(110px, 14cqi, 160px); }
.sp-hero2-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: clamp(24px, 5cqi, 80px); align-items: center; }
.sp-santino-wrap { display: grid; place-items: center; perspective: 1400px; }
.sp-santino { width: min(340px, 78cqi); aspect-ratio: 200/260; }
.sp-santino .sp-face { background: var(--c-surface); box-shadow: 0 30px 60px color-mix(in srgb, var(--c-ink) 28%, transparent); }
.sp-santino .sp-face.front { display: block; height: 100%; }
.sp-santino-in { position: absolute; inset: 0; display: grid; place-items: center; padding: 12%; }

    // tiene validi gli indici anche se le varianti cambiano
    S.vp.forEach((m) => SECS.forEach((s) => { if (m[s.id] == null || m[s.id] >= s.variants.length) m[s.id] = 0; }));
    Object.keys(S.edits || {}).forEach((k) => setPath(content, k, S.edits[k]));

    const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ v: 1, s: Object.assign({}, S, { present: false, edit: false }) })); } catch (e) {} };

    /* ---------------- DOM scaffold ---------------- */
    if (SITE.fontsHref) {
      [].concat(SITE.fontsHref).forEach((href) => { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = href; document.head.appendChild(l); });
    }
    const uiFont = document.createElement("link");
    uiFont.rel = "stylesheet";
    uiFont.href = "https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600;700&display=swap";
    document.head.appendChild(uiFont);

    document.body.insertAdjacentHTML(
      "afterbegin",
      `<div id="stage"><div id="site"></div><div id="site-float"><div class="frame"></div></div></div>
       <div id="cfg-demo-badge">Demo · testi e foto di esempio</div>
       <div id="cfg"></div><div id="cfg-toast" role="status" aria-live="polite"></div>`
    );
    const stage = $("#stage"), site = $("#site"), floatFrame = $("#site-float .frame"), root = $("#cfg");

    const wraps = {};
    SECS.forEach((s) => {
      const w = document.createElement("div");
      w.className = "cfg-sec";
      w.dataset.sec = s.id;
      w.id = "sec-" + s.id;
      site.appendChild(w);
      wraps[s.id] = w;
    });

    /* ---------------- helpers per i template ---------------- */
    let phCount = 0;
    const ph = (label, o = {}) => {
      const seed = hash(label + (o.seed || "") + phCount++);
      const ratio = o.ratio || "4/3";
      const x = 15 + (seed % 70), y = 10 + ((seed >> 7) % 60), a = (seed >> 3) % 360;
      const art = o.art ? `<div class="ph-art">${o.art}</div>` : `<div class="ph-art"></div>`;
      const style = `aspect-ratio:${ratio};--ph-x:${x}%;--ph-y:${y}%;--ph-a:${a}deg;${o.style || ""}`;
      return `<div class="ph ${o.art ? "" : "ph-auto"} ${o.cls || ""}" style="${style}" ${o.attrs || ""}>${art}${o.noTag ? "" : `<span class="ph-tag">Foto esempio · ${esc(label)}</span>`}</div>`;
    };
    const e = (path) => `data-edit="${path}"`;

    const ctxBase = () => ({
      gsap: window.gsap || null,
      ST: window.ScrollTrigger || null,
      motion: S.motion, // 0 statico · 1 morbido · 2 cinematico
      mobile: S.mobile || window.innerWidth <= 720, // anteprima smartphone del pannello OPPURE telefono vero
      proposal: P[S.p],
      pid: P[S.p].id,
      content,
      ph, e, esc,
      lenis: () => lenis,
      scrollTo: (target) => scrollToTarget(target),
    });

    /* ---------------- tema ---------------- */
    function applyTheme() {
      const pr = P[S.p];
      const pals = pr.palettes && pr.palettes.length ? pr.palettes : [{ name: "Base", tokens: pr.tokens }];
      const tok = Object.assign({}, pr.tokens, (pals[S.pal[S.p]] || pals[0]).tokens);
      if (S.accent[S.p]) tok.accent = S.accent[S.p];
      Object.keys(tok).forEach((k) => stage.style.setProperty("--c-" + k, tok[k]));
      const fp = S.font[S.p] >= 0 ? fontPairs[S.font[S.p]] : pr.fonts;
      const f = Object.assign({}, pr.fonts, fp || {});
      stage.style.setProperty("--f-display", f.display);
      stage.style.setProperty("--f-body", f.body);
      if (f.mono) stage.style.setProperty("--f-mono", f.mono);
      document.body.style.background = S.mobile ? "#0f1013" : tok.bg;
      stage.dataset.proposal = pr.id;
      document.documentElement.dataset.proposal = pr.id;
    }

    /* ---------------- animazioni ---------------- */
    let lenis = null;
    function setupLenis() {
      const want = S.motion === 2 && window.Lenis && !reduced();
      if (want && !lenis) {
        lenis = new window.Lenis({ lerp: 0.09, smoothWheel: true });
        if (window.ScrollTrigger) lenis.on("scroll", window.ScrollTrigger.update);
        if (window.gsap) {
          lenis.__tick = (t) => lenis && lenis.raf(t * 1000);
          window.gsap.ticker.add(lenis.__tick);
          window.gsap.ticker.lagSmoothing(0);
        }
      } else if (!want && lenis) {
        if (window.gsap && lenis.__tick) window.gsap.ticker.remove(lenis.__tick);
        lenis.destroy();
        lenis = null;
        document.documentElement.classList.remove("lenis", "lenis-smooth");
      }
    }
    function scrollToTarget(target) {
      const el = typeof target === "string" ? $(target) : target;
      if (!el) return;
      if (lenis) lenis.scrollTo(el, { offset: -10, duration: 1.4 });
      else el.scrollIntoView({ behavior: S.motion ? "smooth" : "auto", block: "start" });
    }

    function splitWords(el) {
      if (el.dataset.split) return $$(".cfg-w > i", el);
      el.dataset.split = "1";
      const walk = (node) => {
        Array.from(node.childNodes).forEach((n) => {
          if (n.nodeType === 3) {
            const parts = n.textContent.split(/(\s+)/);
            const frag = document.createDocumentFragment();
            parts.forEach((p) => {
              if (!p) return;
              if (/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p));
              else { const w = document.createElement("span"); w.className = "cfg-w"; const i = document.createElement("i"); i.textContent = p; w.appendChild(i); frag.appendChild(w); }
            });
            n.replaceWith(frag);
          } else if (n.nodeType === 1 && !n.classList.contains("cfg-w")) walk(n);
        });
      };
      walk(el);
      return $$(".cfg-w > i", el);
    }
    function splitChars(el) {
      if (el.dataset.split) return $$(".cfg-c", el);
      el.dataset.split = "1";
      const walk = (node) => {
        Array.from(node.childNodes).forEach((n) => {
          if (n.nodeType === 3) {
            const frag = document.createDocumentFragment();
            n.textContent.split(/(\s+)/).forEach((word) => {
              if (!word) return;
              if (/^\s+$/.test(word)) { frag.appendChild(document.createTextNode(word)); return; }
              const w = document.createElement("span"); w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
              Array.from(word).forEach((ch) => { const c = document.createElement("span"); c.className = "cfg-c"; c.textContent = ch; w.appendChild(c); });
              frag.appendChild(w);
            });
            n.replaceWith(frag);
          } else if (n.nodeType === 1) walk(n);
        });
      };
      walk(el);
      return $$(".cfg-c", el);
    }

    function autoAnims(scope, ctx) {
      const gsap = window.gsap, ST = window.ScrollTrigger;
      if (!gsap || !ST || !S.motion) return;
      const m = S.motion === 2 ? 1 : 0.45;
      const D = S.motion === 2 ? 1.1 : 0.7;
      const ease = "power3.out";
      const st = (el, extra = {}) => Object.assign({ trigger: el, start: "top 88%", once: true }, extra);

      $$("[data-stagger]", scope).forEach((p) => {
        const kind = p.dataset.stagger || "up";
        Array.from(p.children).forEach((c) => { if (!c.dataset.a) c.dataset.a = kind; c.dataset.aSt = "1"; });
      });
      const groups = new Map();
      $$("[data-a]", scope).forEach((el) => {
        if (el.dataset.aSt) { const p = el.parentElement; if (!groups.has(p)) groups.set(p, []); groups.get(p).push(el); return; }
        animOne(el, 0, null);
      });
      groups.forEach((els, p) => els.forEach((el, i) => animOne(el, i * (S.motion === 2 ? 0.09 : 0.06), p)));

      function animOne(el, delay, trig) {
        const k = el.dataset.a;
        const trigger = st(trig || el);
        const dl = delay + (parseFloat(el.dataset.delay) || 0);
        switch (k) {
          case "up": gsap.from(el, { y: 48 * m, autoAlpha: 0, duration: D, ease, delay: dl, scrollTrigger: trigger }); break;
          case "fade": gsap.from(el, { autoAlpha: 0, duration: D * 1.2, ease: "power1.out", delay: dl, scrollTrigger: trigger }); break;
          case "left": gsap.from(el, { x: -60 * m, autoAlpha: 0, duration: D, ease, delay: dl, scrollTrigger: trigger }); break;
          case "right": gsap.from(el, { x: 60 * m, autoAlpha: 0, duration: D, ease, delay: dl, scrollTrigger: trigger }); break;
          case "scale": gsap.from(el, { scale: 1 + 0.18 * m, autoAlpha: 0, duration: D * 1.3, ease, delay: dl, scrollTrigger: trigger }); break;
          case "zoom": { const inner = el.firstElementChild || el; gsap.from(inner, { scale: 1 + 0.25 * m, duration: D * 1.8, ease: "power2.out", delay: dl, scrollTrigger: trigger }); break; }
          case "reveal":
            gsap.fromTo(el, { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: D * 1.25, ease: "power4.inOut", delay: dl, scrollTrigger: trigger });
            if (el.firstElementChild) gsap.from(el.firstElementChild, { scale: 1.25, duration: D * 1.8, ease: "power3.out", delay: dl, scrollTrigger: st(trig || el) });
            break;
          case "reveal-x":
            gsap.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: D * 1.25, ease: "power4.inOut", delay: dl, scrollTrigger: trigger });
            break;
          case "split": { const w = splitWords(el); gsap.from(w, { yPercent: 115, duration: D, ease: "power4.out", stagger: S.motion === 2 ? 0.045 : 0.02, delay: dl, scrollTrigger: trigger }); break; }
          case "chars": { const c = splitChars(el); gsap.from(c, { yPercent: 60, autoAlpha: 0, rotate: 6 * m, duration: D * 0.8, ease: "back.out(1.6)", stagger: 0.018, delay: dl, scrollTrigger: trigger }); break; }
          case "line": gsap.from(el, { scaleX: 0, transformOrigin: "left center", duration: D * 1.2, ease: "power3.inOut", delay: dl, scrollTrigger: trigger }); break;
          case "count": {
            const end = parseFloat(el.dataset.count || el.textContent.replace(/[^\d.]/g, "")) || 0;
            const dec = (String(el.dataset.count || "").split(".")[1] || "").length;
            const suffix = el.dataset.suffix || "";
            const obj = { v: 0 };
            gsap.to(obj, { v: end, duration: D * 1.8, ease: "power2.out", delay: dl, scrollTrigger: trigger, onUpdate: () => (el.textContent = obj.v.toLocaleString("it-IT", { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suffix) });
            break;
          }
          default: break;
        }
      }
      // parallasse
      $$("[data-speed]", scope).forEach((el) => {
        const sp = parseFloat(el.dataset.speed);
        if (isNaN(sp)) return;
        gsap.to(el, { yPercent: (1 - sp) * 60 * m, ease: "none", scrollTrigger: { trigger: el.closest(".cfg-sec") || el, start: "top bottom", end: "bottom top", scrub: true } });
      });
      // marquee orizzontale
      $$("[data-marquee]", scope).forEach((el) => {
        const sp = parseFloat(el.dataset.marquee) || 40;
        const tw = gsap.to(el, { xPercent: -50, repeat: -1, ease: "none", duration: sp });
        if (S.motion === 2) ST.create({ trigger: el, start: "top bottom", end: "bottom top", onUpdate: (self) => gsap.to(tw, { timeScale: 1 + Math.min(4, Math.abs(self.getVelocity()) / 400), duration: 0.2, overwrite: true, onComplete: () => gsap.to(tw, { timeScale: 1, duration: 0.8 }) }) });
      });
    }

    /* ---------------- render ---------------- */
    const gctx = {}, cleanups = {};
    function sectionVariant(id) { const s = SECS.find((x) => x.id === id); return [s, s.variants[S.vp[S.p][id]] || s.variants[0], S.vp[S.p][id] || 0]; }

    function renderSection(id) {
      const w = wraps[id];
      const [s, v, vi] = sectionVariant(id);
      if (gctx[id]) { gctx[id].revert(); delete gctx[id]; }
      if (cleanups[id]) { try { cleanups[id](); } catch (err) {} delete cleanups[id]; }
      const ctx = ctxBase();
      let html = "";
      try { html = v.html(content, ctx); }
      catch (err) { console.error("[configuratore] errore nel template", id, vi, err); html = `<div style="padding:40px;font:14px monospace;background:#300;color:#fdd">Errore nel template ${id} · ${vi + 1}: ${esc(err.message)}</div>`; }
      w.className = "cfg-sec" + (v.sticky || s.sticky ? " cfg-sticky" : "") + (v.overlay ? " cfg-overlay" : "");
      w.dataset.variant = vi;
      w.innerHTML = html + toolsHTML(s, vi);
      bindTools(w, id);
      if (S.edit) setEditable(w, true);
      const run = () => {
        if (v.init) { try { const r = v.init(w, ctx); if (typeof r === "function") cleanups[id] = r; } catch (err) { console.error("[configuratore] errore init", id, vi, err); } }
        autoAnims(w, ctx);
      };
      if (window.gsap) gctx[id] = window.gsap.context(run, w); else run();
    }
    function toolsHTML(s, vi) {
      return `<div class="cfg-tools" aria-label="Varianti ${esc(s.label)}"><button type="button" data-t="prev" aria-label="Variante precedente">${ICON.prev}</button><span class="lab"><b>${vi + 1}/${s.variants.length}</b>${esc(s.label)} · ${esc(s.variants[vi].name)}</span><button type="button" data-t="next" aria-label="Variante successiva">${ICON.next}</button></div>`;
    }
    function bindTools(w, id) {
      const t = w.querySelector(":scope > .cfg-tools");
      if (!t) return;
      t.querySelector('[data-t="prev"]').onclick = (ev) => { ev.stopPropagation(); cycle(id, -1); };
      t.querySelector('[data-t="next"]').onclick = (ev) => { ev.stopPropagation(); cycle(id, 1); };
    }

    let floatCtx = null, floatClean = null;
    function renderFloat() {
      if (floatCtx) { floatCtx.revert(); floatCtx = null; }
      if (floatClean) { try { floatClean(); } catch (e) {} floatClean = null; }
      if (!SITE.float) { floatFrame.innerHTML = ""; return; }
      const ctx = ctxBase();
      floatFrame.innerHTML = SITE.float.html(content, ctx);
      const run = () => { if (SITE.float.init) { const r = SITE.float.init(floatFrame, ctx); if (typeof r === "function") floatClean = r; } };
      if (window.gsap) floatCtx = window.gsap.context(run, floatFrame); else run();
    }

    function refresh() {
      if (window.ScrollTrigger) { window.ScrollTrigger.refresh(); }
    }
    function renderAll() {
      applyTheme();
      setupLenis();
      SECS.forEach((s) => renderSection(s.id));
      renderFloat();
      requestAnimationFrame(refresh);
    }

    function keepAnchor(fn) {
      // mantiene in vista la sezione corrente dopo un re-render
      const cur = currentSection();
      const w = cur && wraps[cur];
      const before = w ? w.getBoundingClientRect().top : 0;
      fn();
      if (w) {
        const after = w.getBoundingClientRect().top;
        const y = window.scrollY + (after - before);
        if (lenis) lenis.scrollTo(y, { immediate: true }); else window.scrollTo(0, y);
      }
    }

    function setVariant(id, idx) {
      const s = SECS.find((x) => x.id === id);
      const n = s.variants.length;
      S.vp[S.p][id] = ((idx % n) + n) % n;
      save();
      keepAnchor(() => renderSection(id));
      requestAnimationFrame(refresh);
      const w = wraps[id];
      w.classList.remove("cfg-flash"); void w.offsetWidth; w.classList.add("cfg-flash");
      renderPanel();
      toast(`${s.label}: ${s.variants[S.vp[S.p][id]].name}`);
    }
    function cycle(id, d) { setVariant(id, (S.vp[S.p][id] || 0) + d); }
    function setProposal(i) {
      if (i === S.p || !P[i]) return;
      S.p = i; save();
      keepAnchor(renderAll);
      renderPanel(); renderDock();
      toast(`Proposta ${P[i].id} · ${P[i].name}`);
    }

    function currentSection() {
      const mid = window.innerHeight * 0.45;
      let best = null, bd = Infinity;
      SECS.forEach((s) => {
        const r = wraps[s.id].getBoundingClientRect();
        if (r.height < 2) return;
        const d = r.top <= mid && r.bottom >= mid ? 0 : Math.min(Math.abs(r.top - mid), Math.abs(r.bottom - mid));
        if (d < bd) { bd = d; best = s.id; }
      });
      return best;
    }

    /* ---------------- modifica testi ---------------- */
    function setEditable(scope, on) {
      $$("[data-edit]", scope).forEach((el) => {
        if (on) { el.setAttribute("contenteditable", "true"); el.setAttribute("spellcheck", "false"); }
        else { el.removeAttribute("contenteditable"); }
      });
    }
    site.addEventListener("input", (ev) => {
      const el = ev.target.closest && ev.target.closest("[data-edit]");
      if (!el || !S.edit) return;
      const val = esc(el.innerText).replace(/\n/g, "<br>");
      setPath(content, el.dataset.edit, val);
      S.edits[el.dataset.edit] = val;
      save();
    });
    site.addEventListener("click", (ev) => {
      if (S.edit) { const a = ev.target.closest("a"); if (a) ev.preventDefault(); return; }
      const a = ev.target.closest('a[href^="#"]');
      if (a && a.getAttribute("href").length > 1) {
        const t = site.querySelector(a.getAttribute("href"));
        if (t) { ev.preventDefault(); scrollToTarget(t); }
      }
    });
    site.addEventListener("submit", (ev) => { ev.preventDefault(); toast("Modulo di esempio: nella versione finale arriva su WhatsApp o email"); });

    /* ---------------- pannello ---------------- */
    const tabs = [["struttura", "Struttura"], ["stile", "Stile"], ["cliente", "Cliente"]];
    root.innerHTML = `
      <div id="cfg-dock" role="toolbar" aria-label="Configuratore"></div>
      <aside id="cfg-panel" aria-label="Pannello configuratore">
        <div class="cfg-head">
          <div class="row"><span class="cfg-eyebrow">${esc(SITE.meta.sector || "Configuratore")}</span>
          <button class="cfg-icon" type="button" data-act="close" aria-label="Chiudi pannello">${ICON.close}</button></div>
          <h2 class="cfg-client">${esc(SITE.meta.client)}</h2>
        </div>
        <div class="cfg-tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}">${l}</button>`).join("")}</div>
        <div class="cfg-scroll" style="overflow:hidden;display:grid;min-height:0">
          <div class="cfg-body" data-pane="struttura"></div>
          <div class="cfg-body" data-pane="stile"></div>
          <div class="cfg-body" data-pane="cliente"></div>
        </div>
        <div class="cfg-foot">
          <button class="cfg-btn" type="button" data-act="edit">Modifica testi</button>
          <button class="cfg-btn" type="button" data-act="brief">Esporta brief</button>
          <button class="cfg-btn primary" type="button" data-act="present">Presenta</button>
        </div>
      </aside>`;
    const panel = $("#cfg-panel"), dock = $("#cfg-dock");

    function renderDock() {
      dock.innerHTML =
        P.map((p, i) => `<button type="button" data-p="${i}" aria-pressed="${i === S.p}" title="Proposta ${esc(p.id)} · ${esc(p.name)}">${esc(p.id)}</button>`).join("") +
        `<span class="sep"></span>
         <button type="button" class="hide-sm" data-act="mobile" aria-pressed="${S.mobile}" title="Anteprima mobile (M)">${S.mobile ? ICON.desk : ICON.phone}</button>
         <button type="button" data-act="open" title="Apri configuratore">${ICON.gear}<span class="hide-sm">Configura</span></button>`;
    }

    function swatch(t) { return [t.bg, t.ink, t.accent, t.accent2 || t.surface].map((c) => `<i style="background:${c}"></i>`).join(""); }

    function renderPanel() {
      $$(".cfg-tabs [data-tab]", panel).forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
      $$(".cfg-body", panel).forEach((b) => (b.hidden = b.dataset.pane !== S.tab));
      const pr = P[S.p];
      const cur = currentSection();

      $('[data-pane="struttura"]', panel).innerHTML = `
        <div class="cfg-group"><div class="cfg-label">Proposta <kbd>1 · 2 · 3</kbd></div>
          <div class="cfg-props">${P.map((p, i) => `
            <button type="button" class="cfg-prop" data-p="${i}" aria-pressed="${i === S.p}">
              <span class="k">${esc(p.id)}</span>
              <span><span class="t">${esc(p.name)}</span><span class="d" style="display:block">${esc(p.tagline || "")}</span>
              <span class="sw">${swatch(p.tokens)}</span></span>
            </button>`).join("")}</div></div>
        <div class="cfg-group"><div class="cfg-label">Sezioni · 4 varianti <kbd>[ ]</kbd></div>
          <div class="cfg-secs">${SECS.map((s) => {
            const vi = S.vp[S.p][s.id];
            return `<div class="cfg-secrow ${cur === s.id ? "on" : ""}">
              <button type="button" class="n" data-go="${s.id}">${esc(s.label)}<small>${esc(s.variants[vi].name)}${s.variants[vi].desc ? " — " + esc(s.variants[vi].desc) : ""}</small></button>
              <div class="cfg-chips">${s.variants.map((v, i) => `<button type="button" data-sv="${s.id}:${i}" aria-pressed="${i === vi}" title="${esc(v.name)}">${i + 1}</button>`).join("")}</div>
            </div>`;
          }).join("")}</div></div>`;

      const pals = pr.palettes && pr.palettes.length ? pr.palettes : [{ name: "Base", tokens: pr.tokens }];
      $('[data-pane="stile"]', panel).innerHTML = `
        <div class="cfg-group"><div class="cfg-label">Palette · proposta ${esc(pr.id)}</div>
          <div class="cfg-pals">${pals.map((pl, i) => {
            const t = Object.assign({}, pr.tokens, pl.tokens);
            return `<button type="button" class="cfg-pal" data-pal="${i}" aria-pressed="${i === S.pal[S.p]}"><span class="bar"><i style="background:${t.bg}"></i><i style="background:${t.ink}"></i><i style="background:${t.accent}"></i><i style="background:${t.accent2 || t.surface}"></i></span><span>${esc(pl.name)}</span></button>`;
          }).join("")}</div>
          <div class="cfg-field"><input type="color" id="cfg-accent" value="${S.accent[S.p] || toHex((Object.assign({}, pr.tokens, pals[S.pal[S.p]].tokens)).accent)}" aria-label="Colore d'accento"><span class="grow">Colore d'accento su misura</span>${S.accent[S.p] ? '<button type="button" class="cfg-link" data-act="accent-reset">Ripristina</button>' : ""}</div>
        </div>
        <div class="cfg-group"><div class="cfg-label">Tipografia</div>
          <div class="cfg-field"><select id="cfg-font" aria-label="Coppia di font">
            <option value="-1" ${S.font[S.p] < 0 ? "selected" : ""}>Della proposta (${esc(pr.fonts.label || firstFamily(pr.fonts.display))})</option>
            ${fontPairs.map((f, i) => `<option value="${i}" ${S.font[S.p] === i ? "selected" : ""}>${esc(f.label || firstFamily(f.display))}</option>`).join("")}
          </select></div></div>
        <div class="cfg-group"><div class="cfg-label">Animazioni</div>
          <div class="cfg-seg">${["Statico", "Morbido", "Cinematico"].map((l, i) => `<button type="button" data-motion="${i}" aria-pressed="${S.motion === i}">${l}</button>`).join("")}</div></div>
        <div class="cfg-group"><div class="cfg-label">Anteprima <kbd>M</kbd></div>
          <div class="cfg-seg"><button type="button" data-view="0" aria-pressed="${!S.mobile}">Desktop</button><button type="button" data-view="1" aria-pressed="${S.mobile}">Smartphone</button></div></div>
        <div class="cfg-group"><div class="cfg-label">Reimposta</div>
          <div class="cfg-field"><span class="grow">Torna alle scelte iniziali e ai testi originali</span><button type="button" class="cfg-link" data-act="reset">Reimposta demo</button></div></div>`;

      const cl = SITE.checklist || [];
      const ft = SITE.features || [];
      const talk = SITE.talk || [];
      $('[data-pane="cliente"]', panel).innerHTML = `
        ${talk.length ? `<div class="cfg-group"><div class="cfg-label">Come presentarlo</div><ol class="cfg-talk">${talk.map((t) => `<li>${esc(t)}</li>`).join("")}</ol></div>` : ""}
        ${cl.map((g, gi) => `<div class="cfg-group"><div class="cfg-label">${esc(g.group)}</div><div class="cfg-check">${g.items.map((it, ii) => {
          const k = gi + ":" + ii;
          return `<label><input type="checkbox" data-chk="${k}" ${S.checks[k] ? "checked" : ""}><span>${esc(it)}</span></label>`;
        }).join("")}</div></div>`).join("")}
        ${ft.length ? `<div class="cfg-group"><div class="cfg-label">Funzionalità del settore</div><div class="cfg-feat">${ft.map((f) => `<div><b>${esc(f.name)}${f.tier ? `<em>${esc(f.tier)}</em>` : ""}</b><span>${esc(f.desc || "")}</span></div>`).join("")}</div></div>` : ""}`;

      $('[data-act="edit"]', panel).setAttribute("aria-pressed", S.edit);
      $('[data-act="edit"]', panel).textContent = S.edit ? "Fine modifica" : "Modifica testi";
    }
    function firstFamily(f) { return String(f || "").split(",")[0].replace(/["']/g, "").trim(); }
    function toHex(c) {
      if (/^#[0-9a-f]{6}$/i.test(c)) return c;
      if (/^#[0-9a-f]{3}$/i.test(c)) return "#" + c.slice(1).split("").map((x) => x + x).join("");
      const d = document.createElement("div"); d.style.color = c; document.body.appendChild(d);
      const m = getComputedStyle(d).color.match(/\d+/g); d.remove();
      return m ? "#" + m.slice(0, 3).map((x) => (+x).toString(16).padStart(2, "0")).join("") : "#888888";
    }

    function setOpen(o) {
      S.open = o; save();
      document.body.classList.toggle("cfg-open", o);
      document.body.classList.toggle("cfg-side", o && window.innerWidth > 1100);
      if (o) renderPanel();
      setTimeout(refresh, 380);
    }
    function setMobile(m) {
      S.mobile = m; save();
      document.body.classList.toggle("cfg-mobile", m);
      S.p = S.p; renderAll(); renderDock(); renderPanel();
    }
    function setMotion(m) { S.motion = m; save(); keepAnchor(renderAll); renderPanel(); }
    function setPresent(on) {
      S.present = on;
      document.body.classList.toggle("cfg-present", on);
      if (on) { if (S.edit) toggleEdit(false); document.body.classList.remove("cfg-side"); toast("Modalità presentazione · premi P o Esc per uscire"); }
      else if (S.open) document.body.classList.toggle("cfg-side", window.innerWidth > 1100);
      setTimeout(refresh, 380);
    }
    function toggleEdit(on) {
      S.edit = on == null ? !S.edit : on;
      document.body.classList.toggle("cfg-edit", S.edit);
      setEditable(site, S.edit);
      setEditable(floatFrame, S.edit);
      renderPanel();
      if (S.edit) toast("Clicca su un testo del sito per modificarlo");
    }

    root.addEventListener("click", (ev) => {
      const b = ev.target.closest("button,[data-go]");
      if (!b) return;
      if (b.dataset.p != null) return setProposal(+b.dataset.p);
      if (b.dataset.tab) { S.tab = b.dataset.tab; save(); return renderPanel(); }
      if (b.dataset.sv) { const [id, i] = b.dataset.sv.split(":"); setVariant(id, +i); return; }
      if (b.dataset.go) { scrollToTarget(wraps[b.dataset.go]); return; }
      if (b.dataset.pal != null) { S.pal[S.p] = +b.dataset.pal; S.accent[S.p] = null; save(); applyTheme(); renderPanel(); return; }
      if (b.dataset.motion != null) return setMotion(+b.dataset.motion);
      if (b.dataset.view != null) return setMobile(b.dataset.view === "1");
      switch (b.dataset.act) {
        case "open": return setOpen(true);
        case "close": return setOpen(false);
        case "mobile": return setMobile(!S.mobile);
        case "present": return setPresent(true);
        case "edit": return toggleEdit();
        case "brief": return openBrief();
        case "accent-reset": S.accent[S.p] = null; save(); applyTheme(); renderPanel(); return;
        case "reset": {
          const keepOpen = S.open;
          S = defState(); S.open = keepOpen; S.present = false; S.edit = false;
          Object.keys(content).forEach((k) => delete content[k]); Object.assign(content, clone(original));
          save(); document.body.classList.remove("cfg-mobile", "cfg-edit"); renderAll(); renderDock(); renderPanel(); toast("Demo reimpostata");
          return;
        }
      }
    });
    root.addEventListener("input", (ev) => {
      if (ev.target.id === "cfg-accent") { S.accent[S.p] = ev.target.value; save(); applyTheme(); }
    });
    root.addEventListener("change", (ev) => {
      if (ev.target.id === "cfg-font") { S.font[S.p] = +ev.target.value; save(); applyTheme(); setTimeout(refresh, 300); }
      if (ev.target.id === "cfg-accent") renderPanel();
      if (ev.target.dataset.chk) { S.checks[ev.target.dataset.chk] = ev.target.checked; save(); }
    });

    document.addEventListener("keydown", (ev) => {
      const t = ev.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) { if (ev.key === "Escape" && S.edit) toggleEdit(false); return; }
      if ($("#cfg-modal")) { if (ev.key === "Escape") closeBrief(); return; }
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      const k = ev.key.toLowerCase();
      if (/^[1-9]$/.test(k) && P[+k - 1]) { setProposal(+k - 1); return; }
      if (k === "[" || k === "]") { const c = currentSection(); if (c) cycle(c, k === "]" ? 1 : -1); return; }
      if (k === "p") { setPresent(!S.present); return; }
      if (k === "escape") { if (S.present) setPresent(false); else if (S.open) setOpen(false); return; }
      if (k === "m") { setMobile(!S.mobile); return; }
      if (k === "e") { toggleEdit(); return; }
      if (k === "c") { setOpen(!S.open); return; }
    });

    let scrollRaf = 0;
    window.addEventListener("scroll", () => {
      if (scrollRaf) return;
      scrollRaf = requestAnimationFrame(() => {
        scrollRaf = 0;
        if (!S.open || S.tab !== "struttura") return;
        const c = currentSection();
        $$(".cfg-secrow", panel).forEach((r) => r.classList.toggle("on", r.querySelector("[data-go]").dataset.go === c));
      });
    }, { passive: true });
    let wasNarrow = window.innerWidth <= 720, rzT = 0;
    window.addEventListener("resize", () => {
      if (S.open && !S.present) document.body.classList.toggle("cfg-side", window.innerWidth > 1100);
      // telefono ruotato o finestra ristretta: le sezioni scelgono di nuovo tra versione desktop e versione telefono
      clearTimeout(rzT); rzT = setTimeout(() => { const n = window.innerWidth <= 720; if (n !== wasNarrow) { wasNarrow = n; keepAnchor(renderAll); } }, 250);
    });

    /* ---------------- brief ---------------- */
    function briefText() {
      const pr = P[S.p];
      const pals = pr.palettes && pr.palettes.length ? pr.palettes : [{ name: "Base", tokens: pr.tokens }];
      const pal = pals[S.pal[S.p]] || pals[0];
      const tok = Object.assign({}, pr.tokens, pal.tokens);
      if (S.accent[S.p]) tok.accent = S.accent[S.p];
      const fp = S.font[S.p] >= 0 ? fontPairs[S.font[S.p]] : pr.fonts;
      const lines = [];
      lines.push(`# Brief sito — ${SITE.meta.client}`);
      lines.push(`Settore: ${SITE.meta.sector || "-"} · Generato dal configuratore il ${new Date().toLocaleDateString("it-IT")}`);
      lines.push("");
      lines.push(`## Direzione scelta: proposta ${pr.id} · ${pr.name}`);
      if (pr.tagline) lines.push(pr.tagline);
      lines.push("");
      lines.push(`## Sezioni (in ordine)`);
      SECS.forEach((s, i) => { const v = s.variants[S.vp[S.p][s.id]]; lines.push(`${i + 1}. ${s.label} → variante ${S.vp[S.p][s.id] + 1} "${v.name}"${v.desc ? ` — ${v.desc}` : ""}`); });
      lines.push("");
      lines.push(`## Stile`);
      lines.push(`Palette: ${pal.name}`);
      Object.keys(tok).forEach((k) => lines.push(`- --c-${k}: ${tok[k]}`));
      lines.push(`Font display: ${firstFamily(fp.display)} · Font testo: ${firstFamily(fp.body)}`);
      lines.push(`Animazioni: ${["statico", "morbido", "cinematico"][S.motion]}`);
      const ed = Object.keys(S.edits || {});
      if (ed.length) {
        lines.push("");
        lines.push(`## Testi modificati in riunione`);
        ed.forEach((k) => lines.push(`- ${k}: ${S.edits[k].replace(/<br>/g, " / ")}`));
      }
      const cl = SITE.checklist || [];
      if (cl.length) {
        lines.push("");
        lines.push(`## Materiale dal cliente`);
        cl.forEach((g, gi) => { lines.push(`### ${g.group}`); g.items.forEach((it, ii) => lines.push(`- [${S.checks[gi + ":" + ii] ? "x" : " "}] ${it}`)); });
      }
      lines.push("");
      lines.push(`## Note per l'implementazione`);
      lines.push(`Stack: Next.js + TypeScript + Tailwind v4, animazioni GSAP ScrollTrigger + Lenis, deploy Vercel. Tutti i testi e le foto della demo sono di esempio: sostituirli con il materiale reale del cliente.`);
      lines.push("");
      lines.push("```json");
      lines.push(JSON.stringify({ client: SITE.meta.client, proposal: pr.id, variants: S.vp[S.p], palette: pal.name, tokens: tok, fonts: { display: firstFamily(fp.display), body: firstFamily(fp.body) }, motion: S.motion }, null, 2));
      lines.push("```");
      return lines.join("\n");
    }
    function openBrief() {
      const txt = briefText();
      document.body.insertAdjacentHTML("beforeend", `<div id="cfg-modal" role="dialog" aria-modal="true" aria-labelledby="cfg-mt"><div class="box">
        <div><h3 id="cfg-mt">Brief per lo sviluppo</h3><p>Le scelte fatte con il cliente, pronte da incollare in Claude Code per costruire il sito vero.</p></div>
        <textarea id="cfg-brief" readonly>${esc(txt)}</textarea>
        <div class="row"><span class="msg" id="cfg-bm"></span><button type="button" class="cfg-btn" data-x="close">Chiudi</button><button type="button" class="cfg-btn primary" data-x="copy">Copia brief</button></div>
      </div></div>`);
      const m = $("#cfg-modal");
      m.addEventListener("click", (ev) => {
        if (ev.target === m || (ev.target.dataset && ev.target.dataset.x === "close")) return closeBrief();
        if (ev.target.dataset && ev.target.dataset.x === "copy") {
          const ta = $("#cfg-brief");
          const done = () => { $("#cfg-bm").textContent = "Copiato negli appunti"; };
          const fallback = () => { ta.focus(); ta.select(); $("#cfg-bm").textContent = "Testo selezionato: premi Ctrl+C per copiarlo"; };
          try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
        }
      });
      if (lenis) lenis.stop();
    }
    function closeBrief() { const m = $("#cfg-modal"); if (m) m.remove(); if (lenis) lenis.start(); }

    let toastT = 0;
    function toast(msg) {
      if (S.present && !/presentazione/.test(msg)) return;
      const t = $("#cfg-toast"); t.textContent = msg; t.classList.add("on");
      clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800);
    }

    /* ---------------- avvio ---------------- */
    if (window.gsap && window.ScrollTrigger) window.gsap.registerPlugin(window.ScrollTrigger);
    document.title = document.title || SITE.meta.client;
    document.body.classList.toggle("cfg-mobile", S.mobile);
    renderDock();
    renderAll();
    renderPanel();
    if (S.open) setOpen(true);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setTimeout(refresh, 50));
    window.addEventListener("load", () => setTimeout(refresh, 100));

    // API per test e debug
    Configurator.api = {
      state: () => S, setProposal, setVariant, setMotion, setMobile, toggleEdit, setPresent, briefText, renderAll,
      sections: SECS.map((s) => ({ id: s.id, n: s.variants.length })), proposals: P.length,
    };
    return Configurator.api;
  };
})();

</script>
<script>
/* =====================================================================
   SACROPINTO — studio di tatuaggi · Piazza Armerina · configuratore live
   Prefisso classi: .sp-
   Dati veri: sacropinto-site.vercel.app + repo GitHub GiuSem14/sacropinto-site
   (indirizzo, WhatsApp, orari, artisti, servizi, FAQ, guest da Google Sheet). Vedi scheda-cliente.md.
   Tutto ciò che non è lì (prezzi, flash, date, agenda, recensioni) è marcato "esempio".
   ===================================================================== */

/* ---------- helper comuni ---------- */
const SP = {
  WA: "https://wa.me/393929090569",
  wa(text) { return `${SP.WA}?text=${encodeURIComponent(text)}`; },
  magnet(els, x) {
    if (!x.motion || !x.gsap || x.mobile) return () => {};
    const hs = [];
    els.forEach((el) => {
      const mv = (ev) => { const r = el.getBoundingClientRect(); x.gsap.to(el, { x: (ev.clientX - (r.left + r.width / 2)) * 0.28, y: (ev.clientY - (r.top + r.height / 2)) * 0.28, duration: 0.5, ease: "power3.out" }); };
      const lv = () => x.gsap.to(el, { x: 0, y: 0, duration: 0.7, ease: "elastic.out(1,0.4)" });
      el.addEventListener("mousemove", mv); el.addEventListener("mouseleave", lv);
      hs.push(() => { el.removeEventListener("mousemove", mv); el.removeEventListener("mouseleave", lv); });
    });
    return () => hs.forEach((h) => h());
  },
  tilt(els, x, max = 7) {
    if (!x.motion || !x.gsap || x.mobile) return () => {};
    const hs = [];
    els.forEach((el) => {
      const mv = (ev) => { const r = el.getBoundingClientRect(); const px = (ev.clientX - r.left) / r.width - 0.5, py = (ev.clientY - r.top) / r.height - 0.5; x.gsap.to(el, { rotateY: px * max * 2, rotateX: -py * max * 2, transformPerspective: 900, duration: 0.5, ease: "power2.out" }); el.style.setProperty("--mx", (px * 100 + 50) + "%"); el.style.setProperty("--my", (py * 100 + 50) + "%"); };
      const lv = () => x.gsap.to(el, { rotateY: 0, rotateX: 0, duration: 0.8, ease: "power3.out" });
      el.addEventListener("mousemove", mv); el.addEventListener("mouseleave", lv);
      hs.push(() => { el.removeEventListener("mousemove", mv); el.removeEventListener("mouseleave", lv); });
    });
    return () => hs.forEach((h) => h());
  },
  burger(el) {
    const b = el.querySelector(".sp-burger"), hd = el.querySelector(".sp-hd");
    if (!b || !hd) return;
    b.onclick = () => { const o = hd.classList.toggle("open"); b.setAttribute("aria-expanded", o); };
    hd.querySelectorAll(".sp-nav a").forEach((a) => a.addEventListener("click", () => { hd.classList.remove("open"); b.setAttribute("aria-expanded", "false"); }));
  },
  // flip 3D dei santini: funziona sempre (clic o tastiera)
  flips(el) {
    el.querySelectorAll(".sp-flip").forEach((f) => {
      if (!f.hasAttribute("tabindex")) f.setAttribute("tabindex", "0");
      f.setAttribute("role", "button"); f.setAttribute("aria-pressed", "false");
      const t = () => { const on = f.classList.toggle("on"); f.setAttribute("aria-pressed", on); };
      f.addEventListener("click", (e) => { if (e.target.closest("a")) return; t(); });
      f.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } });
    });
  },
  // raggi che si espandono dietro i titoli (firma): elementi [data-rays]
  rays(el, x) {
    if (!x.motion || !x.gsap) { el.querySelectorAll("[data-rays]").forEach((r) => r.classList.add("on")); return; }
    el.querySelectorAll("[data-rays]").forEach((r) => {
      x.gsap.fromTo(r, { rotate: -30, scale: 0.4, autoAlpha: 0 }, { rotate: 20, scale: 1, autoAlpha: 1, ease: "none", scrollTrigger: { trigger: r.parentElement, start: "top 92%", end: "bottom 40%", scrub: 1 } });
    });
  },
  fillWords(p, x, trig) {
    const words = p.textContent.split(/(\s+)/);
    p.innerHTML = words.map((w) => (/^\s*$/.test(w) ? w : `<span class="sp-fw">${x.esc(w)}</span>`)).join("");
    if (!x.motion || !x.gsap) { p.querySelectorAll(".sp-fw").forEach((s) => s.classList.add("on")); return; }
    x.gsap.to(p.querySelectorAll(".sp-fw"), { "--fw": 1, stagger: 0.06, ease: "none", scrollTrigger: { trigger: trig || p, start: "top 70%", end: "bottom 45%", scrub: 0.4 } });
  },
  // messaggio WhatsApp della consulenza a partire dai campi del form
  compose(c, d) {
    const L = c.consulenza.labels;
    const v = (k) => (d.get(k) || "").toString().trim();
    const lines = [c.contatti.msgIntro];
    if (v("zona")) lines.push(`• ${L.zona}: ${v("zona")}`);
    if (v("size")) lines.push(`• ${L.size}: ${v("size")}`);
    if (v("stile")) lines.push(`• ${L.stile}: ${v("stile")}`);
    if (v("artista")) lines.push(`• ${L.artista}: ${v("artista")}`);
    if (v("idea")) lines.push(`• ${L.idea}: ${v("idea")}`);
    if (v("budget")) lines.push(`• ${L.budget}: ${v("budget")}`);
    if (v("quando")) lines.push(`• ${L.quando}: ${v("quando")}`);
    lines.push("", `${L.nome}: ${v("nome")}`);
    return lines.join("\n");
  },
  // collega un form di consulenza: anteprima + link WhatsApp sempre aggiornati
  bindCompose(el, x) {
    const f = el.querySelector("form"), out = el.querySelector(".sp-preview-txt"), link = el.querySelector(".sp-wa-link"), c = x.content;
    if (!f || !out || !link) return () => {};
    const upd = () => { const t = SP.compose(c, new FormData(f)); out.textContent = t; link.href = SP.wa(t); el.querySelectorAll(".sp-chip").forEach((l) => { const i = l.querySelector("input"); if (i) l.classList.toggle("on", i.checked); }); };
    f.addEventListener("input", upd); f.addEventListener("change", upd); upd();
    return () => { f.removeEventListener("input", upd); f.removeEventListener("change", upd); };
  },
  // filtri (artista + stile) e lightbox del portfolio: funzionali sempre
  portfolio(el, x) {
    const items = Array.from(el.querySelectorAll(".sp-work"));
    const state = { a: "Tutti", s: "Tutti" };
    const apply = () => {
      items.forEach((it) => { const ok = (state.a === "Tutti" || it.dataset.a === state.a) && (state.s === "Tutti" || it.dataset.s === state.s); it.classList.toggle("off", !ok); });
      const empty = el.querySelector(".sp-empty"); if (empty) empty.hidden = items.some((i) => !i.classList.contains("off"));
      if (x.ST) setTimeout(() => x.ST.refresh(), 60);
    };
    el.querySelectorAll("[data-f]").forEach((b) => b.addEventListener("click", () => {
      const [k, v] = b.dataset.f.split(":"); state[k] = v;
      el.querySelectorAll(`[data-f^="${k}:"]`).forEach((o) => o.setAttribute("aria-pressed", o === b));
      apply();
      if (x.motion && x.gsap) x.gsap.fromTo(items.filter((it) => !it.classList.contains("off")), { y: 14, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, stagger: 0.03, ease: "power3.out", overwrite: true });
    }));
    const lb = el.querySelector(".sp-lb");
    if (lb) {
      const body = lb.querySelector(".sp-lb-body"), cap = lb.querySelector(".sp-lb-cap"), ask = lb.querySelector(".sp-lb-ask");
      let cur = 0;
      const vis = () => items.filter((it) => !it.classList.contains("off"));
      const show = (i) => {
        const v = vis(); if (!v.length) return;
        cur = ((i % v.length) + v.length) % v.length; const it = v[cur];
        body.innerHTML = it.querySelector(".ph").outerHTML;
        cap.innerHTML = `<b>${x.esc(it.dataset.t)}</b><span>${x.esc(it.dataset.a)} · ${x.esc(it.dataset.s)} · ${x.esc(it.dataset.z)}</span>`;
        if (ask) ask.href = SP.wa(`${x.content.contatti.msgIntro}\n• Mi piace il lavoro "${it.dataset.t}" (${it.dataset.a}, ${it.dataset.s}): vorrei qualcosa in questo stile.\n• Zona: \n• Idea: `);
        if (!lb.open) { try { lb.showModal(); } catch (e) { lb.setAttribute("open", ""); } }
      };
      items.forEach((it) => { it.setAttribute("tabindex", "0"); it.setAttribute("role", "button"); it.setAttribute("aria-label", `Apri ${it.dataset.t}`); it.addEventListener("click", () => show(vis().indexOf(it))); it.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); it.click(); } }); });
      lb.querySelector("[data-lb=prev]").addEventListener("click", () => show(cur - 1));
      lb.querySelector("[data-lb=next]").addEventListener("click", () => show(cur + 1));
      lb.querySelector("[data-lb=close]").addEventListener("click", () => lb.close());
      lb.addEventListener("click", (e) => { if (e.target === lb) lb.close(); });
      const key = (e) => { if (!lb.open) return; if (e.key === "ArrowRight") show(cur + 1); if (e.key === "ArrowLeft") show(cur - 1); };
      document.addEventListener("keydown", key);
      return () => { document.removeEventListener("keydown", key); if (lb.open) lb.close(); };
    }
    return () => {};
  },
  // stato flash: cambia il bottone in "prenotato" dopo il clic (solo visivo, esempio)
  flashStatus(el, x) {
    el.querySelectorAll("[data-flash]").forEach((card) => {
      const b = card.querySelector(".sp-flash-cta");
      if (!b) return;
      b.addEventListener("click", () => { if (x.motion && x.gsap) x.gsap.fromTo(card, { scale: 0.98 }, { scale: 1, duration: 0.6, ease: "elastic.out(1,0.5)" }); });
    });
  },
};

/* ---------- illustrazioni SVG fatte a mano (currentColor / var(--c-…)) ---------- */
const SVG = (vb, inner, extra = "") => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${inner}</svg>`;
const rays = (cx, cy, r1, r2, n, alt = true, w = 2) => {
  let s = "";
  for (let i = 0; i < n; i++) {

/* frammenti del form di consulenza (dichiarati dopo per leggibilità: usati solo a runtime) */
function fieldChips(c, x, name, list, label, path) {
  return `<fieldset class="sp-field"><legend>${label}</legend><div class="sp-chips">${list.map((v, k) => `<label class="sp-chip"><input type="radio" name="${name}" value="${x.esc(v)}"><span ${x.e(`${path}.${k}`)}>${v}</span></label>`).join("")}</div></fieldset>`;
}
function wizardPanes(c, x) {
  const L = c.consulenza.labels;
  const panes = [
    fieldChips(c, x, "zona", c.consulenza.zone, L.zona, "consulenza.zone"),
    fieldChips(c, x, "size", c.consulenza.sizes, L.size, "consulenza.sizes"),
    fieldChips(c, x, "stile", c.consulenza.stili, L.stile, "consulenza.stili"),
    fieldChips(c, x, "artista", c.consulenza.artisti, L.artista, "consulenza.artisti"),
    `<label class="sp-field"><span ${x.e("consulenza.labels.idea")}>${L.idea}</span><textarea name="idea" rows="4" placeholder="${x.esc(L.ideaPh)}"></textarea></label><label class="sp-field"><span ${x.e("consulenza.labels.quando")}>${L.quando}</span><input name="quando" placeholder="${x.esc(L.quandoPh)}"></label>`,
    fieldChips(c, x, "budget", c.consulenza.budgets, L.budget, "consulenza.budgets"),
    `<label class="sp-field"><span ${x.e("consulenza.labels.nome")}>${L.nome}</span><input name="nome" placeholder="${x.esc(L.nomePh)}"></label><div class="sp-preview"><span ${x.e("consulenza.labels.preview")}>${L.preview}</span><p class="sp-preview-txt"></p></div><p class="sp-note" ${x.e("consulenza.hint")}>${c.consulenza.hint}</p><a class="sp-btn wa sp-wa-link" href="${c.contatti.wa}" target="_blank" rel="noopener">${IC.wa}<span ${x.e("consulenza.labels.send")}>${L.send}</span></a>`,
  ];
  return panes.map((p, i) => `<div class="sp-wpane ${i === 0 ? "on" : ""}" data-wp="${i}">${p}</div>`).join("");
}

/* ---------- layer fluttuante: WhatsApp, aureola di avanzamento (firma), cursore ---------- */
const FLOAT = {
  html: (c, x) => `<div class="sp-float">
    <div class="sp-prog" aria-hidden="true">${ART.halo("sp-prog-halo", 20)}<b class="sp-prog-pct">0%</b></div>
    <a class="sp-wa-fab" href="${SP.wa(c.contatti.msgIntro + "\n")}" target="_blank" rel="noopener" aria-label="Scrivici su WhatsApp">${IC.wa}<span>WhatsApp</span></a>
    ${x.pid === "A" ? '<div class="sp-cursor" aria-hidden="true"><i></i></div>' : ""}
  </div>`,
  init: (el, x) => {
    const prog = el.querySelector(".sp-prog"), halo = prog.querySelector(".sp-prog-halo"), ring = prog.querySelector(".sp-halo-ring"), pct = prog.querySelector(".sp-prog-pct"), cur = el.querySelector(".sp-cursor");
    const cleanups = [];
    if (!x.motion || !x.gsap || !x.ST || x.mobile) { prog.style.display = "none"; if (cur) cur.remove(); return; }
    const g = x.gsap;
    g.set(ring, { strokeDasharray: 1000, strokeDashoffset: 1000 });
    const st = x.ST.create({ trigger: document.getElementById("site"), start: "top top", end: "bottom bottom", scrub: 0.5, onUpdate: (s) => { g.set(halo, { rotate: s.progress * 360, transformOrigin: "50% 50%" }); g.set(ring, { strokeDashoffset: 1000 - 766 * s.progress }); pct.textContent = Math.round(s.progress * 100) + "%"; prog.classList.toggle("on", s.progress > 0.03); } });
    cleanups.push(() => st.kill());
    if (cur) {
      const qx = g.quickTo(cur, "x", { duration: 0.3, ease: "power3.out" }), qy = g.quickTo(cur, "y", { duration: 0.3, ease: "power3.out" });
      const mv = (ev) => { const fr = el.getBoundingClientRect(); qx(ev.clientX - fr.left); qy(ev.clientY - fr.top); cur.classList.add("on"); };
      const ov = (ev) => cur.classList.toggle("hov", !!(ev.target.closest && ev.target.closest("a,button,input,select,textarea,summary,label,.sp-flip,.sp-work")));
      const out = () => cur.classList.remove("on");
      document.addEventListener("mousemove", mv); document.addEventListener("mouseover", ov); document.documentElement.addEventListener("mouseleave", out);
      document.body.classList.add("sp-has-cursor");
      cleanups.push(() => { document.removeEventListener("mousemove", mv); document.removeEventListener("mouseover", ov); document.documentElement.removeEventListener("mouseleave", out); document.body.classList.remove("sp-has-cursor"); });
    }
    return () => cleanups.forEach((f) => f());
  },
};
